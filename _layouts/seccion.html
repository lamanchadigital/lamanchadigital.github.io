---
layout: default
---
<h1 class='titulo-seccion'>{{ page.titulo_seccion }}</h1>
{% assign lista = site.posts | where: 'seccion', page.clave %}
{% if lista.size == 0 %}<p>Todavía no hay notas en esta sección.</p>{% endif %}
<section class='grilla'>
  {% for p in lista %}
    {% include tarjeta.html p=p %}
  {% endfor %}
</section>
