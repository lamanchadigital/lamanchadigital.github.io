name: Resumen del día
on:
  workflow_dispatch:
    inputs:
      modo:
        description: 'Modo (prueba no publica en ninguna red)'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - prueba
  schedule:
    - cron: '45 0 * * *'
permissions:
  contents: write
concurrency:
  group: estado
jobs:
  resumen:
    runs-on: ubuntu-latest
    outputs:
      publicado: ${{ steps.cambios.outputs.publicado }}
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - if: ${{ github.event.inputs.modo != 'prueba' }}
        run: python main.py resumen
      - run: python extras.py resumen ${{ github.event.inputs.modo }}
      - id: cambios
        run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -qE '^(_posts|assets)/'; then echo 'publicado=true' >> $GITHUB_OUTPUT; else echo 'publicado=false' >> $GITHUB_OUTPUT; fi
          git diff --cached --quiet || (git commit -m 'estado' && (git push || (git pull --rebase -X theirs && git push)))
  desplegar:
    needs: resumen
    if: needs.resumen.outputs.publicado == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/sitio.yml
  redes:
    needs: [resumen, desplegar]
    if: needs.resumen.outputs.publicado == 'true'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py redes
      - run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'estado' && (git push || (git pull --rebase -X theirs && git push)))
