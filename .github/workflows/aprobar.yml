name: Aprobar notas
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: estado
jobs:
  aprobar:
    runs-on: ubuntu-latest
    outputs:
      publicado: ${{ steps.cambios.outputs.publicado }}
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py aprobar
      - id: cambios
        run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^_posts/'; then echo 'publicado=true' >> $GITHUB_OUTPUT; else echo 'publicado=false' >> $GITHUB_OUTPUT; fi
          git diff --cached --quiet || (git commit -m 'estado' && (git push || (git pull --rebase -X theirs && git push)))
  desplegar:
    needs: aprobar
    if: needs.aprobar.outputs.publicado == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/sitio.yml
  redes:
    needs: [aprobar, desplegar]
    if: needs.aprobar.outputs.publicado == 'true'
    runs-on: ubuntu-latest
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py redes
      - run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'estado' && (git push || (git pull --rebase -X theirs && git push)))
