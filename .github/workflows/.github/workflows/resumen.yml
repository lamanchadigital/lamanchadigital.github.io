name: Resumen del día
on:
  workflow_dispatch:
  schedule:
    - cron: '45 0 * * *'
permissions:
  contents: write
concurrency:
  group: estado
jobs:
  resumen:
    runs-on: ubuntu-latest
    outputs:
      publicado: ${{ steps.cambios.outputs.publicado }}
    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py resumen
      - id: cambios
        run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^_posts/'; then echo 'publicado=true' >> $GITHUB_OUTPUT; else echo 'publicado=false' >> $GITHUB_OUTPUT; fi
          git diff --cached --quiet || (git commit -m 'estado' && (git push || (git pull --rebase -X theirs && git push)))
  desplegar:
    needs: resumen
    if: needs.resumen.outputs.publicado == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/sitio.yml
