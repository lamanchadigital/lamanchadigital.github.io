name: Buscar noticias
on:
  schedule:
    - cron: '0 11,16,22 * * *'
  workflow_dispatch:
    inputs:
      franja:
        description: 'Franja del día (automatica usa la hora actual)'
        required: false
        default: 'automatica'
        type: choice
        options:
          - automatica
          - manana
          - tarde
          - noche
permissions:
  contents: write
concurrency:
  group: estado
jobs:
  buscar:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python main.py buscar ${{ github.event.inputs.franja }}
      - run: |
          git config user.name 'bot'
          git config user.email 'bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || (git commit -m 'estado' && (git push || (git pull --rebase -X theirs && git push)))
